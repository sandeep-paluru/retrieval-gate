[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "retrieval-gate"
version = "0.1.0"
description = "Score a retriever against labeled queries and fail CI when metrics drop."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sandeep Paluru" }]
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
retrieval-gate = "retrieval_gate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["retrieval_gate", "tests", "examples"]
